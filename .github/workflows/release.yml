name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:desktopTest :androidApp:assembleRelease :androidApp:lintDebug --stacktrace

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName *= *"\([0-9][0-9.]*\)".*/\1/p' androidApp/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
              echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION}"
              exit 1
            }
          fi

      - name: Name release artifact
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          OUT="KF-Mobile-${{ steps.version.outputs.version }}-release.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt
          cp androidApp/build/outputs/mapping/release/mapping.txt \
            "KF-Mobile-${{ steps.version.outputs.version }}-mapping.txt"

      - name: Verify signing certificate
        env:
          # Public certificate fingerprint; update only when rotating the release key.
          EXPECTED_CERT_SHA256: 93bafb14811409f97ae7970127b68704eb222ec82f045fc9c74f20a3b6babf29
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [[ -z "$APKSIGNER" ]]; then
            APKSIGNER="$(find "$SDK_ROOT" -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in $SDK_ROOT"; exit 1; }
          CERTS="$("$APKSIGNER" verify --print-certs "KF-Mobile-${{ steps.version.outputs.version }}-release.apk")"
          echo "$CERTS"
          CERT_SHA256="$(echo "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f')"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::Signing certificate SHA-256 mismatch: ${CERT_SHA256:-missing}"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: KF-Mobile-release
          if-no-files-found: error
          path: |
            KF-Mobile-*-release.apk
            KF-Mobile-*-mapping.txt
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KF-Mobile-*-release.apk SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" KF-Mobile-*-release.apk SHA256SUMS.txt \
              --title "$TAG" --generate-notes
          fi